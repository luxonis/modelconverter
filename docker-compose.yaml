x-common: &common
  environment:
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials
    TF_CPP_MIN_LOG_LEVEL: "3"
    # Set these (e.g. `export HOST_UID=$(id -u) HOST_GID=$(id -g)`) so the
    # container chowns the outputs back to you instead of leaving them as root.
    HOST_UID: ${HOST_UID:-}
    HOST_GID: ${HOST_GID:-}
  volumes:
    - ${XDG_CACHE_HOME:-${HOME}/.cache}/modelconverter:/app/shared_with_container
    - ${PWD}/output:/app/output
  secrets:
    - gcp-credentials

x-gpu: &gpu
  <<: *common
  runtime: nvidia

services:
  hailo:
    <<: *gpu
    image: "luxonis/modelconverter-hailo:latest"
    entrypoint: /app/entrypoint.sh

  rvc2:
    <<: *common
    image: "luxonis/modelconverter-rvc2:latest"
    entrypoint: /app/entrypoint.sh

  rvc3:
    <<: *common
    image: "luxonis/modelconverter-rvc3:latest"
    entrypoint: /app/entrypoint.sh

  rvc4:
    <<: *common
    image: "luxonis/modelconverter-rvc4:latest"
    entrypoint: /app/entrypoint.sh

secrets:
  gcp-credentials:
    file: ${GOOGLE_APPLICATION_CREDENTIALS}

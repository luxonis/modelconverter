name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "major, minor, patch, or an explicit version such as 1.2.3"
        type: string
        default: patch

permissions:
  contents: read

jobs:
  release-pr:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-release-pr.yaml@90b4157a4040727fe38905acecb02d75f2f9d768
    with:
      version: ${{ inputs.version }}
      version-file: modelconverter/__init__.py
      project-name: ModelConverter
    secrets:
      WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET }}

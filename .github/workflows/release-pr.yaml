name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "major, minor, patch, or an explicit version such as 1.2.3"
        type: string
        default: patch

jobs:
  release-pr:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-release-pr.yaml@59ca6fe93e5c854289dba1e4dede0700ee57d658
    with:
      version: ${{ inputs.version }}
      version-file: modelconverter/__init__.py
      project-name: ModelConverter
    secrets:
      WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET }}

name: Publish images

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to publish, comma-separated (rvc2, rvc3, rvc4, hailo). Empty publishes all."
        required: false
        type: string
        default: ""
      tool_versions:
        description: "Tool versions to publish, comma-separated (e.g. 2022.3.0,2.41.0). Empty publishes all."
        required: false
        type: string
        default: ""
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  LUXONIS_TELEMETRY_ENABLED: "false"
  GAR_LOCATION: us-central1
  GAR_STEM: us-central1-docker.pkg.dev/easyml-394818

jobs:
  # Selects which of the `.github/matrix.json` entries get published. Without
  # dispatch inputs that is every entry.
  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve matrix
        id: resolve
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TOOL_VERSIONS: ${{ inputs.tool_versions }}
        run: |
          INCLUDE=$(.github/scripts/resolve-matrix.sh "${PLATFORMS}" "${TOOL_VERSIONS}")
          echo "include=${INCLUDE}" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.package }} ${{ matrix.version }}
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix:
        # `default` is the version that also receives the bare `:latest` tag.
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ matrix.package }}
      NAME: luxonis/modelconverter-${{ matrix.package }}
      STEM: modelconverter-${{ matrix.package }}
      VERSION: ${{ matrix.version }}
      DEFAULT: ${{ matrix.default }}
      LOCAL_NAME: luxonis/modelconverter-${{ matrix.package }}:${{ matrix.version }}-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token

      - name: Docker login to GAR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - name: Docker login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Download build files from GCS
        env:
          GS_BUILD_ARTIFACTS: gs://luxonis-test-bucket/modelconverter/build-artifacts
        run: |
          mkdir -p docker/extra_packages
          cd docker/extra_packages
          if [ "${PACKAGE}" = "rvc4" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/snpe-${VERSION}.zip" \
                "snpe-${VERSION}.zip"
          elif [ "${PACKAGE}" = "rvc2" ] || [ "${PACKAGE}" = "rvc3" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/openvino-${VERSION}.tar.gz" \
                "openvino-${VERSION}.tar.gz"
          elif [ "${PACKAGE}" = "hailo" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/hailo-${VERSION}.tar.gz" .
              docker load -i "hailo-${VERSION}.tar.gz"
          fi

      - name: Build image
        run: |
          docker build -f "docker/${PACKAGE}/Dockerfile" \
            -t "${LOCAL_NAME}" . --build-arg VERSION="${VERSION}"

      - name: GHCR publish latest
        run: |
          GHCR_NAME="ghcr.io/${LOCAL_NAME}"
          docker tag "${LOCAL_NAME}" "${GHCR_NAME}"
          docker push "${GHCR_NAME}"
          if [ "${VERSION}" = "${DEFAULT}" ]; then
            GHCR_LATEST_NAME="ghcr.io/${NAME}:latest"
            docker tag "${LOCAL_NAME}" "${GHCR_LATEST_NAME}"
            docker push "${GHCR_LATEST_NAME}"
          fi

      - name: GHCR publish SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          GHCR_NAME="ghcr.io/${NAME}:${VERSION}-${SHA}"
          docker tag "${LOCAL_NAME}" "${GHCR_NAME}"
          docker push "${GHCR_NAME}"

      - name: GAR publish latest
        run: |
          GAR_NAME="${GAR_STEM}/internal/${STEM}:${VERSION}-latest"
          docker tag "${LOCAL_NAME}" "${GAR_NAME}"
          docker push "${GAR_NAME}"
          if [ "${VERSION}" = "${DEFAULT}" ]; then
            GAR_LATEST_NAME="${GAR_STEM}/internal/${STEM}:latest"
            docker tag "${LOCAL_NAME}" "${GAR_LATEST_NAME}"
            docker push "${GAR_LATEST_NAME}"
          fi

      - name: GAR publish SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          GAR_NAME="${GAR_STEM}/internal/${STEM}:${VERSION}-${SHA}"
          docker tag "${LOCAL_NAME}" "${GAR_NAME}"
          docker push "${GAR_NAME}"

      - name: GAR publish clients
        run: |
          read -r -a REPO_ARRAY <<< "${{ vars.EXTERNAL_CLIENTS }}"
          SHA=$(git rev-parse --short HEAD)
          for REPO in "${REPO_ARRAY[@]}"; do
            GAR_CLIENT_NAME="${GAR_STEM}/${REPO}/${STEM}:${VERSION}-${SHA}"
            docker tag "${LOCAL_NAME}" "${GAR_CLIENT_NAME}"
            docker push "${GAR_CLIENT_NAME}"
          done

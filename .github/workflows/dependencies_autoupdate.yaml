name: Python Dependencies Updater

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-python-dependencies:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-dependencies-update.yaml@1556182be18dd350dbeb5b07bc7282e17828b655
    with:
      export-script: tools/export_requirements.sh
    secrets:
      WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET }}

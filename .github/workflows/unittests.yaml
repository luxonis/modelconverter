name: Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - modelconverter/__init__.py
      - requirements.txt
      - requirements-dev.txt
      - "tests/unit/**"
      - "tests/helpers/**"
      - "modelconverter/**"
      - ".github/workflows/unittests.yaml"

  workflow_call:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: true
        type: string
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA)"
        required: true
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_S3_ENDPOINT_URL:
        required: true
      GCP_CREDENTIALS:
        description: "Google service account JSON"
        required: true
      HUBAI_API_KEY:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUXONIS_TELEMETRY_ENABLED: "false"

jobs:
  utils-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout at modelconv_ref
        if: ${{ inputs.modelconv_ref != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: Luxonis/modelconverter
          ref: ${{ inputs.modelconv_ref }}
          path: modelconverter
          persist-credentials: false

      - name: Checkout code
        if: ${{ inputs.modelconv_ref == '' && inputs.ml_ref == '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: modelconverter
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        working-directory: modelconverter
        run: python -m pip install -e .[dev]

      - name: Install specified luxonis-ml
        shell: bash
        env:
          ML_REF: ${{ inputs.ml_ref }}
        if: ${{ inputs.ml_ref != '' }}
        run: |
          pip uninstall luxonis-ml -y
          pip install \
            "luxonis-ml[data,nn-archive] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}" \
            --upgrade --force-reinstall

      - name: Run Tier-1 unit tests with coverage
        working-directory: modelconverter
        # Hermetic host-side unit tests (no cloud/network) -- tiny ONNX models
        # built on the fly. Codecov merges this report with the per-backend
        # e2e reports automatically (via flags), so no manual combine is done.
        run: |
          python -m pytest tests/unit -n auto \
            --cov=modelconverter --cov-branch \
            --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: modelconverter/coverage-unit.xml
          flags: unit
          name: unit
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

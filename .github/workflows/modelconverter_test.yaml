name: Integration tests for ModelConverter

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Which package to test
      version:
        required: true
        type: string
        description: >
          Which version of underlying conversion tools to use
      os:
        required: false
        type: string
        description: >
          Which OS to use for the tests. Defaults to 'ubuntu-latest'.
        default: "ubuntu-latest"

permissions:
  contents: read
  packages: read

env:
  LUXONIS_TELEMETRY_ENABLED: "false"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
  HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
  PACKAGE: ${{ inputs.package }}
  VERSION: ${{ inputs.version }}

jobs:
  tests:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: crazy-max/ghaction-setup-docker@6d7cfa65f60a9dda7b46e5513fa982536f3c9877

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package (host CLI)
        run: pip install -e .

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token

      - name: Prepare build dependencies
        env:
          GS_BUILD_ARTIFACTS: gs://luxonis-test-bucket/modelconverter/build-artifacts
        run: |
          mkdir -p docker/extra_packages
          if [ "${PACKAGE}" = "rvc4" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/snpe-${VERSION}.zip" \
                "docker/extra_packages/snpe-${VERSION}.zip"
          elif [ "${PACKAGE}" = "rvc2" ] || [ "${PACKAGE}" = "rvc3" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/openvino-${VERSION}.tar.gz" \
                "docker/extra_packages/openvino-${VERSION}.tar.gz"
          elif [ "${PACKAGE}" = "hailo" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/hailo-${VERSION}.tar.gz" .
              docker load -i "hailo-${VERSION}.tar.gz"
          fi

      - name: Run e2e conversions (in dev container, with coverage)
        run: |
          modelconverter shell "${PACKAGE}" --dev --no-gpu \
            --tool-version "${VERSION}" \
            -c "python -m pytest tests/e2e -m ${PACKAGE} -x \
                --cov=modelconverter --cov-branch \
                --cov-report=term-missing \
                --cov-report=xml:shared_with_container/coverage-${PACKAGE}-${VERSION}.xml"

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared_with_container/coverage-${{ inputs.package }}-${{ inputs.version }}.xml
          flags: e2e-${{ inputs.package }}
          name: e2e-${{ inputs.package }}-${{ inputs.version }}
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

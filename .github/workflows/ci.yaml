name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        type: string
        default: main
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA)"
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        type: string
        default: main
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA)"
        required: false
        type: string
        default: main
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_S3_ENDPOINT_URL:
        required: true
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: false
      GCP_CREDENTIALS:
        description: "Google service-account JSON"
        required: true
      HUBAI_API_KEY:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  LUXONIS_TELEMETRY_ENABLED: "false"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Install specified LuxonisML
        if: ${{ inputs.ml_ref != '' }}
        env:
          ML_REF: ${{ inputs.ml_ref }}
        run: |
          pip uninstall luxonis-ml -y
          pip install \
            "luxonis-ml[data,nn-archive] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}" \
            --upgrade --force-reinstall

      - name: Run unit tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
        run: |
          python -m pytest tests/unit -n auto \
            --cov --cov-report term-missing \
            --cov-report xml:coverage-unit.xml

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit.xml
          flags: unit
          name: unit
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

      # Keep the report available for CI diagnostics.
      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: ignore

  integration:
    name: ${{ matrix.package }} ${{ matrix.version }}
    needs: unit
    strategy:
      fail-fast: true
      matrix:
        include:
          - { package: rvc2, version: "2021.4.0", os: ubuntu-latest }
          - { package: rvc2, version: "2022.3.0", os: ubuntu-latest }
          - { package: rvc3, version: "2022.3.0", os: ubuntu-latest }
          - { package: rvc4, version: "2.32.6", os: ubuntu-latest }
          - { package: rvc4, version: "2.41.0", os: ubuntu-latest }
          - { package: hailo, version: "2024.10", os: ubuntu-22.04-4core }
          - { package: hailo, version: "2025.01", os: ubuntu-22.04-4core }
          - { package: hailo, version: "2025.04", os: ubuntu-22.04-4core }
    runs-on: ${{ matrix.os }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Docker
        uses: crazy-max/ghaction-setup-docker@6d7cfa65f60a9dda7b46e5513fa982536f3c9877

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package (host CLI)
        run: pip install -e .

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token

      - name: Prepare build dependencies
        env:
          GS_BUILD_ARTIFACTS: gs://luxonis-test-bucket/modelconverter/build-artifacts
        run: |
          mkdir -p docker/extra_packages
          if [ "${PACKAGE}" = "rvc4" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/snpe-${VERSION}.zip" \
                "docker/extra_packages/snpe-${VERSION}.zip"
          elif [ "${PACKAGE}" = "rvc2" ] || [ "${PACKAGE}" = "rvc3" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/openvino-${VERSION}.tar.gz" \
                "docker/extra_packages/openvino-${VERSION}.tar.gz"
          elif [ "${PACKAGE}" = "hailo" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/hailo-${VERSION}.tar.gz" .
              docker load -i "hailo-${VERSION}.tar.gz"
          fi

      - name: Run integration tests
        env:
          ML_REF: ${{ inputs.ml_ref }}
        run: |
          if [[ -n "${ML_REF}" ]]; then
            if [[ ! "${ML_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Invalid luxonis-ml ref: ${ML_REF}" >&2
              exit 1
            fi
            ML_INSTALL_COMMAND="pip uninstall luxonis-ml -y && \
              pip install \
              \"luxonis-ml[data,nn-archive] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}\" \
              --upgrade --force-reinstall &&"
          else
            ML_INSTALL_COMMAND=""
          fi

          PYTEST_MARKERS="${PACKAGE}"
          if [[ "${PACKAGE}" = "rvc2" && "${VERSION}" = "2021.4.0" ]]; then
            PYTEST_MARKERS="${PACKAGE} and not real_model"
          fi

          modelconverter shell "${PACKAGE}" --dev --no-gpu \
            --tool-version "${VERSION}" \
            -c "${ML_INSTALL_COMMAND} \
              python -m pytest tests/conversion -m '${PYTEST_MARKERS}' -x \
                --cov --cov-report term-missing \
                --cov-report xml:shared_with_container/coverage-${PACKAGE}-${VERSION}.xml"

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared_with_container/coverage-${{ matrix.package }}-${{ matrix.version }}.xml
          flags: conversion-${{ matrix.package }}
          name: conversion-${{ matrix.package }}-${{ matrix.version }}
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

      # Keep the report available for CI diagnostics.
      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-conversion-${{ matrix.package }}-${{ matrix.version }}
          path: shared_with_container/coverage-${{ matrix.package }}-${{ matrix.version }}.xml
          if-no-files-found: ignore

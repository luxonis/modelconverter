name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to test, comma-separated (rvc2, rvc3, rvc4, hailo). Empty tests all."
        required: false
        type: string
        default: ""
      tool_versions:
        description: "Tool versions to test, comma-separated (e.g. 2022.3.0,2.41.0). Empty tests all."
        required: false
        type: string
        default: ""
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA). Empty keeps the pinned release. The unit and type-check jobs then use `main`, but not on a release branch."
        required: false
        type: string
        default: ""
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA). Empty tests the branch the run starts from."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      platforms:
        description: "Platforms to test, comma-separated (rvc2, rvc3, rvc4, hailo). Empty tests all."
        required: false
        type: string
        default: ""
      tool_versions:
        description: "Tool versions to test, comma-separated (e.g. 2022.3.0,2.41.0). Empty tests all."
        required: false
        type: string
        default: ""
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA). Empty keeps the pinned release. The unit and type-check jobs then use `main`, but not on a release branch."
        required: false
        type: string
        default: ""
      modelconv_ref:
        description: "modelconverter version (branch/tag/SHA)"
        required: false
        type: string
        default: main
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_S3_ENDPOINT_URL:
        required: true
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: false
      GCP_CREDENTIALS:
        description: "Google service-account JSON"
        required: true
      HUBAI_API_KEY:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  LUXONIS_TELEMETRY_ENABLED: "false"

jobs:
  # `pre-commit` and `docs` gate every test job below. Lint, formatting and a
  # docstring pydoctor cannot render are all cheap failures to find, and
  # finding them here keeps them out of a test log -- and off a self-hosted
  # runner with a device attached.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Run hooks
        run: >-
          uv run --locked --only-group lint prek run
          --all-files --show-diff-on-failure --color=always
        env:
          # CI can run from a checked-out protected branch via `workflow_call`.
          # Keep the hook for local commits, but skip it for a full lint run.
          SKIP: no-commit-to-branch

  docs:
    name: Build docs
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # pydoctor reads the sources rather than importing them, so the package's
      # own dependencies are not needed here.
      - name: Build docs
        run: >
          uv run --locked --only-group docs python -m pydoctor
          --docformat=google
          --warnings-as-errors
          --project-name ModelConverter
          --project-url https://github.com/luxonis/modelconverter
          --html-output /tmp/modelconverter-apidocs
          modelconverter

  typecheck:
    name: Type check
    needs: docs
    runs-on: ubuntu-latest
    env:
      GS_BUILD_ARTIFACTS: gs://luxonis-test-bucket/modelconverter/build-artifacts
      HAILO_WHEEL: hailo_dataflow_compiler-5.3.0-py3-none-linux_x86_64.whl
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --locked

      - name: Install LuxonisML from main
        if: ${{ inputs.ml_ref || !startsWith(inputs.modelconv_ref || github.head_ref || github.ref_name, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: >-
          uv pip install --reinstall-package luxonis-ml
          "luxonis-ml[data,nn_archive,s3,gcs,telemetry] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token

      - name: Install platform dependencies
        run: |
          gcloud storage cp "${GS_BUILD_ARTIFACTS}/${HAILO_WHEEL}" .
          uv pip install --no-deps \
            -r requirements-typecheck.txt \
            "./${HAILO_WHEEL}"

      # The pyright action looks the binary up on PATH, see `version: PATH`.
      - name: Put the virtual environment on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run pyright
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef
        with:
          # `version: PATH` runs the pyright that the lockfile pins, so CI and
          # a local run agree.
          version: PATH
          warnings: true

  unit:
    name: Unit tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --locked

      - name: Install LuxonisML from main
        if: ${{ inputs.ml_ref || !startsWith(inputs.modelconv_ref || github.head_ref || github.ref_name, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: >-
          uv pip install --reinstall-package luxonis-ml
          "luxonis-ml[data,nn_archive,s3,gcs,telemetry] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Run unit tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
        run: |
          uv run --no-sync pytest tests/unit -n auto \
            --junitxml junit-unit.xml -o junit_family=legacy \
            --cov --cov-report term-missing \
            --cov-report xml:coverage-unit.xml

      - name: Upload test results to Codecov
        if: ${{ always() && github.event_name == 'pull_request' && !inputs.modelconv_ref }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit-unit.xml
          flags: unit
          name: unit
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: ignore

  resolve-matrix:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          # Needed to diff the pull request against its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve matrix
        id: resolve
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TOOL_VERSIONS: ${{ inputs.tool_versions }}
          # Empty unless this is a pull request against this repository. A
          # `workflow_call` carries the *caller's* pull request context, whose
          # commits do not exist here, so it always tests the full matrix.
          BASE_SHA: ${{ !inputs.modelconv_ref && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "${BASE_SHA}" ] && [ -z "${PLATFORMS}" ]; then
            CHANGED=$(git diff --name-only "${BASE_SHA}...HEAD")
            echo "Changed files:"
            echo "${CHANGED}"

            PLATFORMS=$(.github/scripts/changed-platforms.sh <<<"${CHANGED}")
            if [ -z "${PLATFORMS}" ]; then
              echo "No platform code changed, skipping the integration tests."
              echo "include=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Affected platforms: ${PLATFORMS}"
          fi

          INCLUDE=$(.github/scripts/resolve-matrix.sh "${PLATFORMS}" "${TOOL_VERSIONS}")
          echo "include=${INCLUDE}" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.package }} ${{ matrix.version }}
    needs: [unit, resolve-matrix]
    if: ${{ needs.resolve-matrix.outputs.include != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Docker
        uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install package (host CLI)
        run: uv sync --locked --no-default-groups

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token

      - name: Prepare build dependencies
        env:
          GS_BUILD_ARTIFACTS: gs://luxonis-test-bucket/modelconverter/build-artifacts
        run: |
          mkdir -p docker/extra_packages
          if [ "${PACKAGE}" = "rvc4" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/snpe-${VERSION}.zip" \
                "docker/extra_packages/snpe-${VERSION}.zip"
          elif [ "${PACKAGE}" = "rvc2" ] || [ "${PACKAGE}" = "rvc3" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/openvino-${VERSION}.tar.gz" \
                "docker/extra_packages/openvino-${VERSION}.tar.gz"
          elif [ "${PACKAGE}" = "hailo" ]; then
              gcloud storage cp \
                "${GS_BUILD_ARTIFACTS}/hailo-${VERSION}.tar.gz" .
              docker load -i "hailo-${VERSION}.tar.gz"
          fi

      - name: Run integration tests
        env:
          ML_REF: ${{ inputs.ml_ref }}
        run: |
          if [[ -n "${ML_REF}" ]]; then
            if [[ ! "${ML_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "Invalid luxonis-ml ref: ${ML_REF}" >&2
              exit 1
            fi
            # Each image pins the versions its vendor tools were built
            # against. RVC4 holds NumPy 1.x, because `snpe-onnx-to-dlc` is
            # a C extension that reads garbage under the 2.x ABI. Hailo holds
            # pyparsing 2.4.7, because the dataflow compiler parses its model
            # scripts with a grammar that pyparsing 3.x rejects. A plain
            # `--force-reinstall` of luxonis-ml pulls the newer versions in
            # and corrupts the conversion.
            #
            # luxonis-ml requires the newer versions, so pip cannot satisfy
            # the pins and that requirement at the same time. The image build
            # has the same conflict. It installs the packages first, then it
            # puts the pins back. The commands below do the same, from the
            # same file the image builds from. A wheel that is built against
            # the newer version also runs with the pinned one, so the
            # downgrade keeps the environment usable.
            #
            # The NumPy pin is taken from the image itself, because only RVC4
            # states it in a requirements file. The other images inherit it
            # from a vendor package.
            ML_INSTALL_COMMAND="python -c \"import numpy; open('/tmp/numpy-pin.txt', 'w').write('numpy==' + numpy.__version__)\" && \
              pip uninstall luxonis-ml -y && \
              pip install \
              \"luxonis-ml[data,nn-archive] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}\" \
              --upgrade --force-reinstall && \
              pip install -r /app/modelconverter/platforms/${PACKAGE}/requirements.txt && \
              pip install -r /tmp/numpy-pin.txt &&"
          else
            ML_INSTALL_COMMAND=""
          fi

          uv run --no-sync modelconverter shell "${PACKAGE}" --dev --no-gpu \
            --tool-version "${VERSION}" \
            -c "${ML_INSTALL_COMMAND} \
              python -m pytest tests/conversion -m '${PACKAGE}' -x \
                --junitxml output/junit-${PACKAGE}-${VERSION}.xml \
                -o junit_family=legacy \
                --cov --cov-report term-missing \
                --cov-report xml:output/coverage-${PACKAGE}-${VERSION}.xml"

      # Only a pull request of this repository reports to Codecov, see the
      # unit job.
      - name: Upload test results to Codecov
        if: ${{ always() && github.event_name == 'pull_request' && !inputs.modelconv_ref }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: output/junit-${{ matrix.package }}-${{ matrix.version }}.xml
          flags: conversion
          name: conversion-${{ matrix.package }}-${{ matrix.version }}
          fail_ci_if_error: false
          disable_search: true
          handle_no_reports_found: true

      # The coverage itself is uploaded by the `coverage` job, once every test
      # job has finished. The artifact is what that job collects, and it keeps
      # the report available for CI diagnostics.
      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-conversion-${{ matrix.package }}-${{ matrix.version }}
          path: output/coverage-${{ matrix.package }}-${{ matrix.version }}.xml
          if-no-files-found: ignore

  # Codecov evaluates the commit every time a report arrives, so uploading from
  # the test jobs themselves makes it judge the run against whichever reports
  # happen to have landed and report a coverage drop that is not real. The
  # reports are collected from the artifacts and uploaded here instead, once
  # every test job has finished.
  #
  # Only a pull request of this repository reports to Codecov, see the unit job.
  coverage:
    name: Upload coverage
    needs: [unit, integration]
    if: ${{ always() && github.event_name == 'pull_request' && !inputs.modelconv_ref && needs.unit.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      # Required by codecov-action, it builds the path-fixing file network
      # from the checked out repository.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.modelconv_ref && 'Luxonis/modelconverter' || github.repository }}
          ref: ${{ inputs.modelconv_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Collect coverage files
        id: coverage-files
        shell: bash
        run: |
          set -euo pipefail

          # `download-artifact` leaves the directory out entirely when nothing
          # matched, and a bare `find` failure hides why.
          mkdir -p coverage

          unit=$(find coverage -type f -name 'coverage-unit.xml' | sort | paste -sd, -)
          if [[ -z "$unit" ]]; then
            echo "No unit coverage report found" >&2
            exit 1
          fi

          # Whatever is left comes from a `tests/conversion` run inside one of
          # the platform images. Empty when the integration tests were skipped.
          conversion=$(find coverage -type f -name 'coverage-*.xml' \
            ! -name 'coverage-unit.xml' | sort | paste -sd, -)

          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "conversion=$conversion" >> "$GITHUB_OUTPUT"

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.unit }}
          flags: unit
          name: unit
          fail_ci_if_error: false
          disable_search: true

      - name: Upload conversion coverage to Codecov
        if: ${{ steps.coverage-files.outputs.conversion != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-files.outputs.conversion }}
          flags: conversion
          name: conversion
          fail_ci_if_error: false
          disable_search: true

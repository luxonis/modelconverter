[project]
name = "modelconv"
description = "Converter for neural models into various formats."
readme = "README.md"
license-files = ["LICENSE"]
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Luxonis", email = "support@luxonis.com" }]
maintainers = [{ name = "Luxonis", email = "support@luxonis.com" }]
keywords = ["ml", "onnx", "openvino", "nn", "ai", "embedded"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "Pillow",
  "aiobotocore<2.18",
  "cyclopts~=4.16",
  "docker",
  "hubai-sdk>=0.3.3",
  "keyring",
  "luxonis-ml[data,nn_archive,s3,gcs,telemetry]~=0.9.0",
  "onnx==1.21.0",
  "onnx_graphsurgeon",
  "onnxruntime",
  "onnxsim~=0.6",
  "onnxslim~=0.1",
  "psutil",
  "wget",
]

[project.optional-dependencies]
bench = ["depthai>=3.8.0,<4"]
analysis = ["depthai>=3.8.0,<4", "plotly", "polars"]

[dependency-groups]
lint = ["prek~=0.4.13"]
docs = ["pydoctor~=25.10"]
# The Docker images install this group, and they only run the tests. They
# never run the hooks, and they never build the docs. Keep those two tools in
# `lint` and `docs`, so an image does not pull them in.
test = [
  "depthai>=3.8.0,<4",
  # Lets the tests emit tiny .tflite fixtures directly (no TensorFlow needed).
  "flatbuffers~=25.12",
  "hypothesis~=6.163",
  # The type gate runs this exact release, so a new pyright cannot turn CI red
  # on its own. Raise it deliberately.
  "pyright==1.1.411",
  "pytest-cov~=7.1",
  "pytest-sugar~=1.1",
  "pytest-xdist~=3.5",
  "tflite2onnx~=0.1",
]
dev = [
  { include-group = "lint" },
  { include-group = "docs" },
  { include-group = "test" },
]

[project.scripts]
modelconverter = "modelconverter.__main__:app.meta"

[project.urls]
repository = "https://github.com/luxonis/modelconverter"
issues = "https://github.com/luxonis/modelconverter/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# albumentations (a luxonis-ml[data] dependency) pulls opencv-python-headless
# in next to the opencv-python that luxonis-ml already requires. Both packages
# ship the same `cv2` module and overwrite each other, so keep the headless
# build out of the resolution entirely.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
# onnxruntime 1.24 dropped Python 3.10: its metadata still allows it, but it
# ships no cp310 wheels. Hold the 3.10 fork of the lock on the last release
# that does.
constraint-dependencies = ["onnxruntime<1.24; python_full_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modelconverter*"]

[tool.setuptools.dynamic]
version = { attr = "modelconverter.__version__" }


[tool.ruff]
target-version = "py310"
line-length = 79
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "NPY",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ANN002",
  "ANN003",
  "ANN204",
  "ANN401",
  "D202",
  "D203",
  "D205",
  "D212",
  "D213",
  "E501",
  "ICN002",
  "NPY002",
  "PERF203",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "G004",
  "PLR2004",
  "PLW2901",
  "PTH123",
  "RET503",
  "RUF012",
  "S101",
  "S311",
  "S603",
  "S607",
  "SIM108",
  "TRY003",
  "TRY301",
  "W191",
]
unfixable = ["B905", "PLC0208"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "D103"]
"__main__.py" = ["ANN201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__".msg = "Do not use imports from __future__."

[tool.docformatter]
black = true
style = "google"
wrap-summaries = 72
wrap-descriptions = 72

[tool.pyright]
typeCheckingMode = "basic"
# The benchmark suite runs on the internal Luxonis HIL testbed and imports
# `hil_framework`, which is not published. No environment outside the testbed
# can resolve it, so these files are not type checked. The first three entries
# are pyright's own defaults, which a custom `exclude` would otherwise drop.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tests/test_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/conversion"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "unit: host-side unit tests (fast, no Docker)",
  "rvc2: RVC2 conversion tests",
  "rvc3: RVC3 conversion tests",
  "rvc4: RVC4 conversion tests",
  "hailo: Hailo conversion tests",
]

[tool.coverage.run]
source = ["modelconverter", "tests"]
relative_files = true
omit = [
  "**/__main__.py",
  "modelconverter/utils/onnx_tools.py",
  "modelconverter/utils/onnx_compatibility.py",
  "modelconverter/platforms/base_benchmark.py",
  "modelconverter/platforms/*/benchmark.py",
  "modelconverter/platforms/base_analyze.py",
  "modelconverter/platforms/*/analyze.py",
  "modelconverter/platforms/base_visualize.py",
  "modelconverter/platforms/*/visualize.py",
  "modelconverter/platforms/rvc4/utils.py",
  "modelconverter/utils/device_handlers.py",
  "modelconverter/utils/device_monitors.py",
  "modelconverter/utils/telemetry.py",
  "modelconverter/utils/log_latency.py",
  "modelconverter/utils/hubai_utils.py",
  "modelconverter/utils/docker_utils.py",
  "modelconverter/utils/progress_handler.py",
  "modelconverter/utils/environ.py",
  "tests/test_benchmark/*.py",
]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "def __rich_repr__",
  "def __str__",
  "assert",
  "raise AssertionError",
  "raise NotImplementedError",
  "except ImportError",
  "@abstractmethod",
  "@overload",
  "(sys\\.)?exit\\(",
  "exit\\(",
  "cv2\\.imshow",
  "cv2\\.waitKey",
  "logger\\.",
  "pytest\\.skip",
  "exit_with\\(",
]

[tool.typos.default.extend-words]
# The Hailo model script format and its config field are called "alls".
alls = "alls"
# The Python CA-bundle package.
certifi = "certifi"

[project]
name = "modelconv"
description = "Converter for neural models into various formats."
readme = "README.md"
license-files = ["LICENSE"]
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Luxonis", email = "support@luxonis.com" }]
maintainers = [{ name = "Luxonis", email = "support@luxonis.com" }]
keywords = ["ml", "onnx", "openvino", "nn", "ai", "embedded"]
dynamic = ["dependencies", "optional-dependencies", "version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.scripts]
modelconverter = "modelconverter.__main__:app.meta"

[project.urls]
repository = "https://github.com/luxonis/modelconverter"
issues = "https://github.com/luxonis/modelconverter/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelconverter*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "modelconverter.__version__" }

[tool.setuptools.dynamic.optional-dependencies]
bench = { file = ["requirements-bench.txt"] }
analysis = { file = ["requirements-analysis.txt"] }
dev = { file = ["requirements-dev.txt", "requirements-bench.txt"] }
rvc2 = { file = ["modelconverter/platforms/rvc2/requirements.txt"] }
rvc3 = { file = ["modelconverter/platforms/rvc3/requirements.txt"] }
rvc4 = { file = ["modelconverter/platforms/rvc4/requirements.txt"] }
hailo = { file = ["modelconverter/platforms/hailo/requirements.txt"] }


[tool.ruff]
target-version = "py310"
line-length = 79
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "NPY",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "ANN002",
  "ANN003",
  "ANN204",
  "ANN401",
  "D1",
  "E501",
  "ICN002",
  "NPY002",
  "PERF203",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "G004",
  "PLR2004",
  "PLW2901",
  "PTH123",
  "RET503",
  "RUF012",
  "S101",
  "S311",
  "S603",
  "S607",
  "SIM108",
  "TRY003",
  "TRY301",
  "W191",
]
unfixable = ["B905", "PLC0208"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]
"__main__.py" = ["ANN201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__".msg = "Do not use imports from __future__."

[tool.docformatter]
black = true
style = "epytext"
wrap-summaries = 72
wrap-descriptions = 72

[tool.pyright]
typeCheckingMode = "basic"
# The benchmark suite runs on the internal Luxonis HIL testbed and imports
# `hil_framework`, which is not published. No environment outside the testbed
# can resolve it, so these files are not type checked. The first three entries
# are pyright's own defaults, which a custom `exclude` would otherwise drop.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tests/test_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/conversion"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "unit: host-side unit tests (fast, no Docker)",
  "rvc2: RVC2 conversion tests",
  "rvc3: RVC3 conversion tests",
  "rvc4: RVC4 conversion tests",
  "hailo: Hailo conversion tests",
]

[tool.coverage.run]
source = ["modelconverter", "tests"]
relative_files = true
omit = [
  "**/__main__.py",
  "modelconverter/utils/onnx_tools.py",
  "modelconverter/utils/onnx_compatibility.py",
  "modelconverter/platforms/base_benchmark.py",
  "modelconverter/platforms/*/benchmark.py",
  "modelconverter/platforms/base_analyze.py",
  "modelconverter/platforms/*/analyze.py",
  "modelconverter/platforms/base_visualize.py",
  "modelconverter/platforms/*/visualize.py",
  "modelconverter/platforms/rvc4/utils.py",
  "modelconverter/utils/device_handlers.py",
  "modelconverter/utils/device_monitors.py",
  "modelconverter/utils/telemetry.py",
  "modelconverter/utils/log_latency.py",
  "modelconverter/utils/hub_requests.py",
  "modelconverter/utils/hubai_utils.py",
  "modelconverter/utils/docker_utils.py",
  "modelconverter/utils/progress_handler.py",
  "modelconverter/utils/environ.py",
  "tests/test_benchmark/*.py",
]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "def __rich_repr__",
  "def __str__",
  "assert",
  "raise AssertionError",
  "raise NotImplementedError",
  "except ImportError",
  "@abstractmethod",
  "@overload",
  "(sys\\.)?exit\\(",
  "exit\\(",
  "cv2\\.imshow",
  "cv2\\.waitKey",
  "logger\\.",
  "pytest\\.skip",
  "exit_with\\(",
]

[tool.typos.default.extend-words]
# The Hailo model script format and its config field are called "alls".
alls = "alls"
# The Python CA-bundle package.
certifi = "certifi"

default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      - id: export-requirements
        name: Export pip compatibility requirements
        entry: tools/export_requirements.sh
        language: system
        pass_filenames: false
        # The generated exports are listed too, so a hand edit gets reverted.
        # requirements-eval.txt and requirements-typecheck.txt stay hand-written:
        # both install with `--no-deps` and hold pins no resolver accepts.
        files: ^(pyproject\.toml|uv\.lock|modelconverter/__init__\.py|tools/export_requirements\.sh|modelconverter/platforms/[a-z0-9]+/(pyproject\.toml|uv\.lock|requirements(-dev)?\.txt))$

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3

    hooks:
      - id: taplo-format

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
